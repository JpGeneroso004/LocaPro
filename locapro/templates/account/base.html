<!DOCTYPE html>
{% load static %}
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Autenticação - LocaPro{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { 
      background: linear-gradient(135deg, #002240 0%, #004581 100%);
      margin: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      max-width: 500px;
      width: 100%;
      padding: 40px 30px;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo-container img {
      max-height: 80px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn-primary {
      background-color: #004581;
      border-color: #004581;
    }
    .btn-primary:hover {
      background-color: #003366;
      border-color: #003366;
    }
    /* Estilos padrões do allauth */
    .auth-card h1 {
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
      text-align: center;
    }
    .auth-card p {
      color: #666;
      text-align: center;
    }
    .auth-card form {
      margin-top: 20px;
    }
    .auth-card input[type="text"], 
    .auth-card input[type="email"], 
    .auth-card input[type="password"] {
      display: block;
      width: 100%;
      padding: 0.375rem 0.75rem;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.5;
      color: #212529;
      background-color: #fff;
      background-clip: padding-box;
      border: 1px solid #ced4da;
      border-radius: 0.375rem;
      margin-bottom: 15px;
    }
    .auth-card button[type="submit"] {
      display: block;
      width: 100%;
      padding: 0.75rem;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background-color: #004581;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      margin-top: 20px;
    }
    .auth-card button[type="submit"]:hover {
      background-color: #003366;
    }
  </style>
</head>
<body>

  
  <script>
    function smartBack() {
      if (document.referrer && document.referrer.includes(window.location.host)) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    }
  </script>
  <div class="auth-card">
    <a href="javascript:void(0)" onclick="smartBack()" style="text-decoration:none; color:#666; font-weight:bold; display:inline-block; margin-bottom: 20px;">
      &larr; Voltar
    </a>

    <div class="logo-container">
      <img src="{% static 'img/locapro_logo.jpg' %}" alt="LocaPro">
    </div>
    
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
  </div>

</body>
</html>
