{% extends 'base.html' %}
{% block title %}Novo Membro da Equipe - LocaPro{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row mb-4">
        <div class="col-12">
            <h2><i class="bi bi-person-plus-fill text-warning"></i> Adicionar Membro</h2>
            <p class="text-muted">Crie um login para um novo funcionário da sua empresa.</p>
        </div>
    </div>

    <div class="row">
        <div class="col-md-6 mx-auto">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nome do Funcionário</label>
                            <input type="text" name="nome" class="form-control" required placeholder="Ex: Maria Souza">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">E-mail (Login)</label>
                            <input type="email" name="email" class="form-control" required placeholder="maria@suaempresa.com">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Senha de Acesso</label>
                            <input type="password" name="senha" class="form-control" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Nível de Acesso (Cargo)</label>
                            <select name="cargo" class="form-select" required>
                                <option value="funcionario">Funcionário (Acesso normal)</option>
                                <option value="dono">Dono / Administrador (Pode gerenciar equipe e excluir eventos)</option>
                            </select>
                        </div>

                        <hr>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'empresas:equipe' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-warning fw-bold text-dark">
                                <i class="bi bi-check-circle"></i> Criar Login
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
