<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastre sua Locadora - Art.Tendas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card-cadastro { max-width: 450px; width: 100%; border-radius: 1rem; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .logo-header { background: #0A0A0A; color: #FFD600; padding: 20px; text-align: center; border-radius: 1rem 1rem 0 0; }
  </style>
</head>
<body>

<div class="card-cadastro card">
  <div class="logo-header">
    <h2 class="fw-bold mb-0">🎪 Art.Tendas SaaS</h2>
    <small class="text-white-50">Crie a sua base grátis</small>
  </div>
  <div class="card-body p-4">
    
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-bold">Nome da Empresa (Locadora)</label>
        <input type="text" name="empresa_nome" class="form-control" required placeholder="Ex: Central Tendas">
      </div>
      
      <div class="mb-3">
        <label class="form-label fw-bold">Seu Nome</label>
        <input type="text" name="nome" class="form-control" required placeholder="Ex: João da Silva">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">E-mail (Será seu login)</label>
        <input type="email" name="email" class="form-control" required placeholder="joao@exemplo.com">
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">Senha</label>
        <input type="password" name="senha" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-warning w-100 fw-bold fs-5 shadow-sm text-dark">Criar Minha Conta</button>
      
      <div class="text-center mt-3">
        <small class="text-muted">Já tem uma conta? <a href="/admin/login/">Faça Login</a></small>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
