version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=arttendas
      - POSTGRES_USER=artuser
      - POSTGRES_PASSWORD=artpass
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=minha_chave_secreta_super_segura
      - ALLOWED_HOSTS=127.0.0.1,localhost,0.0.0.0
      - DATABASE_URL=postgres://artuser:artpass@db:5432/arttendas
    depends_on:
      - db

volumes:
  postgres_data:
